<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taligent · Hitos Históricos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange:     #F5A623;
  --orange-lt:  #FDB94A;
  --orange-dk:  #E08A00;
  --amber-bg:   #FFF8EC;
  --amber-sec:  #FFF3D6;
  --white:      #FFFFFF;
  --navy:       #0D1F3C;
  --text:       #1A1A2E;
  --muted:      #6B7280;
  --border:     #F0E6D3;
  --card-sh:    0 2px 12px rgba(245,166,35,0.10);
  --radius:     16px;
  --font:       'Plus Jakarta Sans', sans-serif;

  --c-legal:    #3B82F6;
  --c-legal-bg: #EFF6FF;
  --c-tech:     #F97316;
  --c-tech-bg:  #FFF7ED;
  --c-partner:  #22C55E;
  --c-partner-bg:#F0FDF4;
  --c-growth:   #EAB308;
  --c-growth-bg:#FEFCE8;
  --c-cultura:  #A855F7;
  --c-cultura-bg:#FAF5FF;
}

body {
  font-family: var(--font);
  background: var(--amber-bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── TOP NAV BAR ───────────────────────────────────── */
.topbar {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-lt) 60%, #FDC96A 100%);
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-icon {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.25);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.topbar-icon svg { width: 20px; height: 20px; fill: white; }
.topbar-title { color: white; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.topbar-sub   { color: rgba(255,255,255,0.85); font-size: 0.72rem; font-weight: 500; margin-top: 1px; }
.topbar-meta  { display: flex; align-items: center; gap: 10px; }
.topbar-date  {
  background: rgba(255,255,255,0.2);
  color: white; font-size: 0.8rem; font-weight: 600;
  padding: 5px 12px; border-radius: 20px;
  display: flex; align-items: center; gap: 5px;
}
.topbar-badge {
  background: var(--navy); color: white;
  font-size: 0.75rem; font-weight: 700;
  padding: 5px 12px; border-radius: 20px;
}

/* ── ACTION BAR ────────────────────────────────────── */
.actionbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0.65rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.action-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: white;
  font-family: var(--font);
  font-size: 0.8rem; font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--orange); color: var(--orange); }
.action-btn svg { width: 14px; height: 14px; }
.action-btn.primary {
  background: var(--orange); color: white; border-color: var(--orange);
}
.action-btn.primary:hover { background: var(--orange-dk); border-color: var(--orange-dk); }
.spacer { flex: 1; }

/* ── LAYOUT ────────────────────────────────────────── */
.page { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

/* ── SECTION BLOCK ─────────────────────────────────── */
.section-block {
  background: linear-gradient(160deg, #FFFDF7 0%, var(--amber-sec) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.3rem 0.8rem;
}
.section-header-left { display: flex; align-items: center; gap: 10px; }
.section-icon {
  width: 36px; height: 36px;
  background: var(--amber-sec);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
}
.section-icon svg { width: 18px; height: 18px; }
.section-title { font-size: 1.15rem; font-weight: 800; color: var(--text); line-height: 1; }
.section-sub   { font-size: 0.76rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
.section-meta  { font-size: 0.78rem; font-weight: 700; color: var(--orange); }

/* ── FILTER PILLS ──────────────────────────────────── */
.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 0 1.3rem 1rem;
}
.fpill {
  padding: 4px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 0.75rem; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}
.fpill:hover { border-color: var(--orange); color: var(--orange); }
.fpill.on { background: var(--navy); color: white; border-color: var(--navy); }
.fpill[data-c="Fundación & Legal"].on    { background: var(--c-legal);   border-color: var(--c-legal);   }
.fpill[data-c="Tecnología & Proyectos"].on { background: var(--c-tech); border-color: var(--c-tech);   }
.fpill[data-c="Clientes & Partnerships"].on{ background: var(--c-partner); border-color: var(--c-partner); }
.fpill[data-c="Crecimiento"].on          { background: var(--c-growth);  border-color: var(--c-growth); color: var(--text); }
.fpill[data-c="Cultura & Equipo"].on     { background: var(--c-cultura); border-color: var(--c-cultura); }

/* ── CARDS GRID ────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
  padding: 0 1rem 1.2rem;
}

.hito-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem 1.1rem;
  box-shadow: var(--card-sh);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
  display: none; /* hidden by default, shown by JS */
}
.hito-card.visible { display: block; }
.hito-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,166,35,0.18); }

/* Colored top stripe */
.hito-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--stripe, var(--orange));
  border-radius: 14px 14px 0 0;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.6rem;
}
.year-badge {
  font-size: 0.72rem; font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--badge-bg, #FFF8EC);
  color: var(--badge-color, var(--orange));
  letter-spacing: 0.03em;
}
.cat-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--stripe, var(--orange));
  margin-top: 4px;
  flex-shrink: 0;
}
.card-title {
  font-size: 0.92rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 0.45rem;
}
.card-desc {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 0.7rem;
}
.cat-label {
  display: inline-block;
  font-size: 0.68rem; font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  background: var(--badge-bg, #FFF8EC);
  color: var(--badge-color, var(--orange-dk));
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ── STATS BAR ─────────────────────────────────────── */
.stats-section {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-lt) 100%);
  border-radius: var(--radius);
  padding: 1.3rem 1.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  text-align: center;
}
.stat-item strong {
  display: block;
  font-size: 1.8rem;
  font-weight: 900;
  color: white;
  line-height: 1;
}
.stat-item span {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.85);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ── TIMELINE VIEW (alternative) ──────────────────── */
.tl-list { padding: 0 1rem 1.2rem; display: flex; flex-direction: column; gap: 0; }
.tl-row {
  display: flex;
  gap: 0;
  align-items: stretch;
  display: none;
}
.tl-row.visible { display: flex; }
.tl-year-col {
  width: 64px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 1rem;
  position: relative;
}
.tl-year-col::after {
  content: '';
  position: absolute;
  top: 38px; bottom: 0; left: 50%;
  width: 2px;
  background: var(--border);
  transform: translateX(-50%);
}
.tl-row:last-of-type .tl-year-col::after { display: none; }
.tl-yr-label {
  font-size: 0.7rem; font-weight: 800;
  color: var(--orange);
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 3px 8px;
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.tl-dot-line {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--stripe, var(--orange));
  margin-top: 8px;
  position: relative; z-index: 1;
  border: 2px solid white;
  box-shadow: 0 0 0 2px var(--stripe, var(--orange));
}
.tl-content {
  flex: 1;
  padding: 0.75rem 0.5rem 1.2rem 1rem;
}
.tl-card-inner {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem 1rem;
  box-shadow: var(--card-sh);
  position: relative;
  overflow: hidden;
}
.tl-card-inner::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--stripe, var(--orange));
  border-radius: 12px 0 0 12px;
}

/* ── VIEW TOGGLE ───────────────────────────────────── */
.view-toggle {
  display: flex; gap: 6px;
}
.vtog {
  padding: 4px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: white;
  font-family: var(--font);
  font-size: 0.75rem; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.vtog.on { background: var(--orange); color: white; border-color: var(--orange); }
.vtog svg { width: 13px; height: 13px; }

/* ── NO RESULTS ────────────────────────────────────── */
.no-res {
  text-align: center; padding: 2.5rem 1rem;
  color: var(--muted); font-size: 0.9rem;
  display: none;
}
.no-res-emoji { font-size: 2rem; margin-bottom: 0.5rem; }

/* ── FOOTER ────────────────────────────────────────── */
footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.8rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  background: white;
  margin-top: 1rem;
}
footer strong { color: var(--orange); }

@media (max-width: 600px) {
  .page { padding: 1rem 0.5rem 2rem; }
  .topbar-badge { display: none; }
  .topbar-brand img { height: 30px !important; }
  .topbar-title { font-size: 1.1rem; }
  
  /* Esconder 'Imprimir' y centrar tabs */
  .actionbar { justify-content: center; }
  .actionbar .action-btn { display: none; }
  .actionbar .spacer { display: none; }
  
  /* Stats apilados y más chicos */
  .stats-section { 
    grid-template-columns: 1fr; 
    gap: 0.8rem; 
    padding: 1rem; 
  }
  .stat-item { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .stat-item strong { display: inline-block; font-size: 1.5rem; }
  .stat-item span { font-size: 0.8rem; }
  
  /* Filtros scrolleables horizontalmente en vez de apilarse mal */
  .filter-row { 
    flex-wrap: nowrap; 
    overflow-x: auto; 
    -webkit-overflow-scrolling: touch; 
    padding-bottom: 0.8rem; 
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .fpill { flex-shrink: 0; }
  
  /* Ajustes a header de seccion */
  .section-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  
  .cards-grid { grid-template-columns: 1fr; }
  
  /* Optimización visual del timeline vertical para ahorrar espacio */
  .tl-year-col { width: 50px; }
  .tl-content { padding: 0.5rem 0.2rem 1rem 0.5rem; }
  .cat-label { font-size: 0.6rem; padding: 2px 6px; }
}
</style>
</head>

const hitos = [

  { year:"2020", hito:"Creacion de Celulas de I+D", cat:"Tecnología & Proyectos", desc:"Creamos las primeras celulas internas de innovacion tecnologica, para explorar con mas profundidad nuevas tecnologias y crear nuevos servicios /  Business Unit." },

  { year:"", hito:"1er Proyecto de Ingenieria de Datos", cat:"Tecnología & Proyectos", desc:"" },
  { year:"2021", hito:"1er Programa de Mentoring", cat:"", desc:"Desarrollamos el 1er programa de mentoring interno para perfiles con potencial de crecimiento." },
  { year:"", hito:"Inicio de la Relación con Microsoft", cat:"Clientes & Partnerships", desc:"Taligent comienza a trabajar con Microsoft, ampliando su stack tecnológico hacia el ecosistema Power Platform (Power Apps, Automate y Power BI) y Azure" },
  { year:"", hito:"Inicio de la Relación con AWS", cat:"Clientes & Partnerships", desc:"Taligent comienza a trabajar con AWS, ampliando su stack tecnológico y pudiendo ofrecer arquitecturas modernas de datos con servicios de la nube de AWS." },
  { year:"2022", hito:"100 Personas en el Equipo", cat:"Crecimiento", desc:"Taligent alcanza las 100 personas en su equipo, un hito que refleja el crecimiento sostenido de la empresa en la última década." },
  { year:"2020", hito:"1er Contrato con Monsanto / Bayer", cat:"Clientes & Partnerships", desc:"Inicio de la relación comercial con Monsanto / Bayer , una de las empresas más grandes del Agro de Argentina, en un proyecto de analítica de datos aplicadas al supply chain" },
  { year:"", hito:"1er Contrato con Pilgrims Global", cat:"Clientes & Partnerships", desc:"Inicio de la relación comercial con Pilgrims global (JBS Group) , una de las empresas de produccion de alimentos mas grandes del Mundo, en un proyecto de Ingenieria de datos con Snowflake, Fivetran , DBT y Qlik" },
  { year:"", hito:"1er Proyecto de Inteligencia Artificial Generativa", cat:"Tecnología & Proyectos", desc:"" },
];

const CAT_CFG = {
  "Fundación & Legal":      { stripe:"#3B82F6", bg:"#EFF6FF", color:"#1D4ED8" },
  "Tecnología & Proyectos": { stripe:"#F97316", bg:"#FFF7ED", color:"#C2410C" },
  "Clientes & Partnerships":{ stripe:"#22C55E", bg:"#F0FDF4", color:"#15803D" },
  "Crecimiento":            { stripe:"#EAB308", bg:"#FEFCE8", color:"#A16207" },
  "Cultura & Equipo":       { stripe:"#A855F7", bg:"#FAF5FF", color:"#7E22CE" },
};

let currentCat = 'all';
let currentView = 'list';

function buildCards() {
  const grid = document.getElementById('cardsGrid');
  const list = document.getElementById('tlList');
  grid.innerHTML = '';
  list.innerHTML = '';

  const filtered = currentCat === 'all' ? hitos : hitos.filter(h => h.cat === currentCat);
  document.getElementById('count-label').textContent = filtered.length + ' hito' + (filtered.length !== 1 ? 's' : '');
  document.getElementById('noRes').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach(h => {
    const cfg = CAT_CFG[h.cat] || { stripe:'#F5A623', bg:'#FFF8EC', color:'#E08A00' };

    // CARD
    const card = document.createElement('div');
    card.className = 'hito-card visible';
    card.style.setProperty('--stripe', cfg.stripe);
    card.style.setProperty('--badge-bg', cfg.bg);
    card.style.setProperty('--badge-color', cfg.color);
    card.innerHTML = `
      <div class="card-top">
        <span class="year-badge">${h.year}</span>
        <div class="cat-dot"></div>
      </div>
      <div class="card-title">${h.hito}</div>
      <div class="card-desc">${h.desc}</div>
      <span class="cat-label">${h.cat}</span>
    `;
    grid.appendChild(card);

    // TIMELINE ROW
    const row = document.createElement('div');
    row.className = 'tl-row visible';
    row.style.setProperty('--stripe', cfg.stripe);
    row.innerHTML = `
      <div class="tl-year-col">
        <span class="tl-yr-label">${h.year}</span>
        <div class="tl-dot-line" style="background:${cfg.stripe};box-shadow:0 0 0 2px ${cfg.stripe}"></div>
      </div>
      <div class="tl-content">
        <div class="tl-card-inner">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.4rem">
            <div class="card-title" style="margin-bottom:0">${h.hito}</div>
            <span class="cat-label" style="background:${cfg.bg};color:${cfg.color};margin-left:8px;white-space:nowrap">${h.cat}</span>
          </div>
          <div class="card-desc" style="margin-bottom:0">${h.desc}</div>
        </div>
      </div>
    `;
    list.appendChild(row);
  });

  applyView();
}

function applyView() {
  const grid = document.getElementById('cardsGrid');
  const list = document.getElementById('tlList');
  if (currentView === 'grid') {
    grid.style.display = '';
    list.style.display = 'none';
  } else {
    grid.style.display = 'none';
    list.style.display = 'flex';
  }
}

function setView(v) {
  currentView = v;
  document.getElementById('vGrid').classList.toggle('on', v === 'grid');
  document.getElementById('vList').classList.toggle('on', v === 'list');
  applyView();
}

document.getElementById('filterRow').addEventListener('click', e => {
  const btn = e.target.closest('.fpill');
  if (!btn) return;
  document.querySelectorAll('.fpill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentCat = btn.dataset.c;
  buildCards();
});
